[package]
name = "ehentai"
version = "0.1.0"
edition = "2024"
description = "A terminal user interface (TUI) for browsing and viewing e-hentai.org manga"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mnk-works/ehentai-tui"
homepage = "https://github.com/mnk-works/ehentai-tui"
readme = "README.md"

[[bin]]
name = "ehentai"
path = "src/main.rs"

[dependencies]
# Terminal UI
ratatui = "0.29"
crossterm = "0.29"

# HTTP client for e-hentai.org requests
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls"] }

# HTML parsing
scraper = "0.22"
url = "2.5"

# Data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Asynchronous runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"
